name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every night at 00:07 UTC (01:07 in winter, 02:07 in summer in Central Europe). Not at the full
  # hour, because GitHub delays or drops scheduled runs at the start of every hour
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Run only scenarios matching a tag or title, for example @smoke'
        required: false
        default: ''

# The event is part of the group, so that a nightly run and a push to main do not cancel each other
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request needs its whole history to check the commit messages
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the branch name
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: node scripts/branch.mjs check "$BRANCH"

      - name: Check the pull request title and the commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/commit-message.mjs --text "$TITLE"
          node scripts/commit-message.mjs --range "$BASE..$HEAD"

      - name: Check
        run: npm run check

  e2e:
    name: E2E (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        env:
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
          PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
          PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            npm test -- --project=${{ matrix.project }} --grep "$GREP"
          else
            npm test -- --project=${{ matrix.project }}
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Only the publishing workflow reads these, and it runs for main only
      - name: Upload Allure results
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14
